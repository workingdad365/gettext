[package]
name = "gettext"
version = "1.0.1"
edition = "2024"
description = "GetText - 화면의 어떤 텍스트든 클릭 한 번으로 복사하는 Windows 트레이 프로그램"

[[bin]]
name = "GetText"
path = "src/main.rs"

[dependencies]
eframe = "0.37.0"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"

[package.metadata.winresource]
ProductName = "GetText"
FileDescription = "GetText"
LegalCopyright = "Copyright (c) 2026"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
